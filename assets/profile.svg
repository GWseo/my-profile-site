    <circle cx="178" cy="30" r="1.8"/><circle cx="214" cy="58" r="2.4"/><circle cx="196" cy="96" r="1.8"/>
    <circle cx="30" cy="190" r="1.8"/><circle cx="58" cy="214" r="2.4"/><circle cx="96" cy="200" r="1.8"/>
    <circle cx="200" cy="196" r="2"/><circle cx="220" cy="168" r="1.8"/>
